<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        * { box-sizing: border-box; }
        body { font-family: 'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif; width: 300px;
               margin: 0; background: #ffffff; color: #0f2747; font-size: 13px; line-height: 1.45; }
        header { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid #e8eef7; color: #256abf; }
        .wordmark { font-weight: 700; font-size: 14px; color: #0f2747; letter-spacing: -0.01em; }
        .wordmark span { color: #256abf; }
        main { padding: 14px 16px 16px; }
        .label { font-size: 10px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: #7b8aa1; margin-bottom: 4px; }
        #host { font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace; font-size: 12px; word-break: break-all; margin-bottom: 12px; }
        #status { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-radius: 8px;
                  border: 1px solid #dce6f2; background: #f4f8fd; margin-bottom: 12px; }
        #status .icon { flex: none; width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center;
                        justify-content: center; background: #e1ecfa; color: #256abf; }
        #status-title { font-weight: 600; }
        #detail { color: #4a5d78; font-size: 12px; margin-top: 1px; }
        #status.safe { background: #f2f9f4; border-color: #cfe8d6; }
        #status.safe .icon { background: #dcf1e2; color: #17803d; }
        #status.malicious { background: #fdf3f3; border-color: #f3caca; }
        #status.malicious .icon { background: #fbe1e1; color: #c23434; }
        #status.allowed { background: #fdf8ec; border-color: #f1e0b4; }
        #status.allowed .icon { background: #f8ecc9; color: #946200; }
        button { display: block; width: 100%; margin-top: 6px; padding: 8px 10px; border-radius: 6px; cursor: pointer;
                 font: 600 12px 'Segoe UI', system-ui, sans-serif; background: #ffffff; color: #256abf; border: 1px solid #c5d6ee; }
        button:hover { background: #f4f8fd; }
        button.primary { background: #256abf; color: #ffffff; border-color: #256abf; }
        button.primary:hover { background: #1c5cab; }
        button.subtle { border-color: transparent; color: #4a5d78; font-weight: 500; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <header>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
        <div class="wordmark">Threat<span>Scanner</span> Shield</div>
    </header>
    <main>
        <div class="label">Current site</div>
        <div id="host">&mdash;</div>
        <div id="status">
            <div class="icon" id="status-icon"></div>
            <div><div id="status-title">Checking&hellip;</div><div id="detail"></div></div>
        </div>
        <button id="revoke" class="primary hidden">Remove exception and block again</button>
        <button id="rescan" class="hidden">Forget verdict and rescan</button>
        <button id="clear-all" class="subtle">Clear all cached verdicts</button>
    </main>
    <script src="cache.js"></script>
    <script src="popup.js"></script>
</body>
</html>
